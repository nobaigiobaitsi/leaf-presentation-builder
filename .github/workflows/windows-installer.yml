name: Build Windows installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run desktop:setup
      - run: npm run desktop:make
      - uses: actions/upload-artifact@v4
        with:
          name: LEAF-Windows-Installer
          path: desktop/out/make/squirrel.windows/x64/*
          if-no-files-found: error
          retention-days: 14
